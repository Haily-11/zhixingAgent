spring:
  application:
    name: zhixing_travel_assistant
  datasource:
    url: jdbc:postgresql://localhost:54328/travel_planner_db
    username: root
    password: 654321
    driver-class-name: org.postgresql.Driver


  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_AUTH_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
      timeout: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_uuid



server:
  port: 10010
  servlet:
    context-path: /api

logging:
  level:
    org.mybatis: WARN
    com.baomidou.mybatisplus: WARN
    dev.langchain4j.mcp: ERROR

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen3-max
        api-key: ${ALIYVN_API_KEY}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${ALIYVN_API_KEY}
      streaming-chat-model:
        model-name: qwen3-max
        api-key: ${ALIYVN_API_KEY}


pgvector:
  host: localhost
  port: 54328
  database: travel_planner_db
  user: root
  password: 654321
  table: agent_embeddings
  drop-table-first: false
  create-table: true

auth:
  secret: zhixing_travel_assistant


pgcheckpoint:
  host: localhost
  username: root
  password: 654321
  database: travel_planner_db
  port: 54328

rag:
  docs-path: docs/rag
  max-results: 8
  min-score: 0.6
  fallback-min-score: 0.45
  parent-context:
    enabled: true
    max-results: 4
  rerank:
    enabled: false
  multi-query:
    enabled: true
    count: 3
    max-merged-results: 24
  hyde:
    enabled: false
    max-chars: 600
